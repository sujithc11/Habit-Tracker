<!DOCTYPE html>
<html>
<head>
    <title>Signup</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-black via-slate-900 to-blue-900 px-4">

    <!-- Signup Card -->
    <div class="w-full max-w-md bg-white/10 backdrop-blur-lg border border-white/20 rounded-3xl shadow-2xl p-8">

        <!-- Title -->
        <div class="text-center mb-8">

            <h1 class="text-4xl font-bold text-white mb-2">
                Create Account 🚀
            </h1>

            <p class="text-gray-300">
                Start building powerful habits today
            </p>

        </div>

        <!-- Signup Form -->
        <form method="POST" class="space-y-5">

            {% csrf_token %}

            <!-- Username -->
            <div>

                <label class="block text-gray-300 mb-2">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter your username"
                    class="w-full px-4 py-3 rounded-xl bg-white/10 border border-gray-500 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-cyan-400 transition duration-300"
                    required
                >

            </div>

            <!-- Password -->
            <div>

                <label class="block text-gray-300 mb-2">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Create a strong password"
                    class="w-full px-4 py-3 rounded-xl bg-white/10 border border-gray-500 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-400 transition duration-300"
                    required
                >

            </div>

            <!-- Signup Button -->
            <button
                type="submit"
                class="w-full bg-gradient-to-r from-green-500 to-blue-500 hover:from-green-400 hover:to-blue-400 text-white font-semibold py-3 rounded-xl transition duration-300 shadow-lg hover:shadow-green-500/40"
            >
                Signup
            </button>

        </form>

        <!-- Login Link -->
        <p class="text-center mt-6 text-gray-300">

            Already have an account?

            <a
                href="/login/"
                class="text-cyan-400 font-semibold hover:text-cyan-300 hover:underline"
            >
                Login here
            </a>

        </p>

    </div>

</body>
</html>

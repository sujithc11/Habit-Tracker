<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-black via-slate-900 to-green-900 px-4">

    <!-- Login Card -->
    <div class="w-full max-w-md bg-white/10 backdrop-blur-lg border border-white/20 rounded-3xl shadow-2xl p-8">

        <!-- Title -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-white mb-2">
                Welcome Back 👋
            </h1>

            <p class="text-gray-300">
                Login to continue your habit journey
            </p>
        </div>

        <!-- Login Form -->
        <form method="POST" class="space-y-5">

            {% csrf_token %}

            <!-- Username -->
            <div>
                <label class="block text-gray-300 mb-2">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter your username"
                    class="w-full px-4 py-3 rounded-xl bg-white/10 border border-gray-500 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-cyan-400 transition duration-300"
                    required
                >
            </div>

            <!-- Password -->
            <div>
                <label class="block text-gray-300 mb-2">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    class="w-full px-4 py-3 rounded-xl bg-white/10 border border-gray-500 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-400 transition duration-300"
                    required
                >
            </div>

            <!-- Login Button -->
            <button
                type="submit"
                class="w-full bg-gradient-to-r from-blue-500 to-green-500 hover:from-blue-400 hover:to-green-400 text-white font-semibold py-3 rounded-xl transition duration-300 shadow-lg hover:shadow-green-500/40"
            >
                Login
            </button>

        </form>

        <!-- Signup -->
        <p class="text-center mt-6 text-gray-300">
            Don't have an account?

            <a
                href="/signup/"
                class="text-cyan-400 font-semibold hover:text-cyan-300 hover:underline"
            >
                Sign up first
            </a>
        </p>

    </div>

</body>
</html>
